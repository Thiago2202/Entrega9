spring.application.name=aula

# URL de conexão com o PostgreSQL (substitua 'nome_do_banco' pelo seu banco)
spring.datasource.url=jdbc:postgresql://localhost:5432/techx

# Credenciais de acesso
spring.datasource.username=postgres
spring.datasource.password=220207

# Driver do PostgreSQL (opcional nas versões mais recentes, mas recomendado)
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Permite que o Jackson receba JSON sem o campo "id" (chave primitiva long)
# ao criar um novo registro via POST, usando 0 como valor padrao nesse caso
spring.jackson.deserialization.fail-on-null-for-primitives=false